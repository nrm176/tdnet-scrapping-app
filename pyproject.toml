[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdnet-scraper"
version = "0.1.0"
description = "Scrape, persist, and serve Japanese TDnet disclosures."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "nrm176" }
]
keywords = ["TDnet", "scraping", "pydantic", "finance", "Japan"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "requests>=2.31,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.2,<6.0",
  "pydantic>=2.12,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "greenlet>=3.1,<4.0",
  "pymupdf4llm>=0.0.17,<1.0",
]

[project.urls]
Homepage = "https://github.com/nrm176/tdnet-scrapping-app"
Repository = "https://github.com/nrm176/tdnet-scrapping-app"
Issues = "https://github.com/nrm176/tdnet-scrapping-app/issues"

[project.scripts]
tdnet = "tdnet.cli:main"

[project.optional-dependencies]
layout = [
  "pymupdf-layout>=1.27.2,<2.0",
]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<6.0",
  "aiosqlite>=0.20,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tdnet*"]
